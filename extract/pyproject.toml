[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysone-extract"
version = "0.1.0"
description = "A small, local System One extraction model: typed values from text in one forward pass"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.51",
    "tokenizers>=0.20",
    "safetensors>=0.4",
    "python-dateutil>=2.8",
    "httpx>=0.27",
]

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
data = ["datasets>=2.20"]
dev = ["pytest>=8", "fastapi>=0.115", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
include = ["sysone_extract*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
